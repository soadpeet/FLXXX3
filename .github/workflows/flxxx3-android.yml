# AI disclaimer: this file was written autonomously by an AI agent (Claude).
#
# FLXXX3: builds the Android APK (Android 10 and newer) the same way as on the development
# computer (docs/android-port/build/configure-api29.sh, preset "android-api29" in
# CMakePresets.json, docs/android-port/build-install.sh).
# The dependencies (Qt, FFmpeg, ... for API 29) are built on the development computer
# (build-deps-api29.sh, about 3 h) and packed by pack-deps-api29.sh; the file lies in the
# GitHub release DEPS_TAG of this repository.
# Signature: with the release key if the secrets FLXXX3_KEYSTORE_B64 (the .jks, base64) and
# FLXXX3_KEYSTORE_PASS are set, otherwise with a key made for this run only (such an APK cannot
# update an installed FLXXX3). Called by the release workflow (flxxx3-release.yml) with
# release: true, the release key is required.
# Start test: the APK is started in Android emulators (x86_64 images that translate ARM code,
# Android 11 to 13; there is no such image of Android 10) and must still run after 90 s
# (tools/ci/android_start_test.sh). Real graphics drivers and the FLX4 are not tested there.
name: FLXXX3 Android build

on:
  push:
    branches: [android-midi]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: "Release build: sign with the release key (required)"
        type: boolean
        default: false
    outputs:
      artifact:
        description: "Name of the artifact with the APK"
        value: ${{ jobs.android.outputs.artifact }}

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android arm64 (API 29)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      artifact: ${{ steps.apk.outputs.artifact }}
    env:
      DEPS_TAG: deps-android-api29-20261120
      DEPS_FILE: flxxx3-deps-2.7-arm64-android-api29-20261120.tar.xz
      DEPS_SHA256: 7bd3ed8f70ab4c2cabe3282cd7b3af22acb9baf7d122a1b563a210e747ae40b3
      NDK_VERSION: 27.2.12479018
      BASE: ${{ github.workspace }}/../mixxx-android
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules
          df -h .

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1-mesa-dev libdrm-dev libgbm-dev libsm-dev libsm6 libudev-dev \
            libxrandr-dev nasm zip ninja-build libtool autopoint gperf texinfo
          # Libraries of the Qt tools that run on the build computer (qmlimportscanner, moc, ...).
          sudo apt-get install -y -q libegl1 libopengl0 libglx0 libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinput0 libxcb-xkb1 libxrender1 libice6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "build-tools;35.0.0" "platforms;android-35" "platform-tools" > /dev/null
          mkdir -p "$BASE"
          cat > "$BASE/env.sh" <<EOF
          export ANDROID_SDK=$ANDROID_HOME
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION
          export JAVA_HOME=$JAVA_HOME
          EOF

      - name: Dependencies (release ${{ env.DEPS_TAG }})
        run: |
          mkdir -p "$BASE/buildenv"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$DEPS_FILE" \
            "https://github.com/${{ github.repository }}/releases/download/$DEPS_TAG/$DEPS_FILE"
          echo "$DEPS_SHA256  $RUNNER_TEMP/$DEPS_FILE" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$DEPS_FILE" -C "$BASE/buildenv"
          rm "$RUNNER_TEMP/$DEPS_FILE"
          df -h .
          # Every Qt tool for the build computer must find its libraries (else e.g. exit code 127).
          missing="$(ldd "$BASE"/buildenv/*/installed/x64-linux-release/tools/Qt6/bin/* 2>/dev/null | grep 'not found' | sort -u || true)"
          if [ -n "$missing" ]; then echo "::error title=Qt tools::missing libraries: $(echo $missing)"; exit 1; fi

      - name: Configure
        run: |
          set -o pipefail
          MIXXX_ANDROID_BASE="$BASE" bash docs/android-port/build/configure-api29.sh "$BASE/build" 2>&1 \
            | tee "$RUNNER_TEMP/configure.log" || { bash tools/ci/annotate_failure.sh Configure "$RUNNER_TEMP/configure.log"; exit 1; }

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.FLXXX3_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.FLXXX3_KEYSTORE_PASS }}
          RELEASE: ${{ inputs.release || false }}
        run: |
          if [ "$RELEASE" = "true" ] && { [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; }; then
            echo "::error title=Release key::secrets FLXXX3_KEYSTORE_B64 and FLXXX3_KEYSTORE_PASS are not set"
            exit 1
          fi
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_ALIAS=flxxx3" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=release" >> "$GITHUB_ENV"
          else
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -alias ci -keyalg RSA -keysize 2048 \
              -validity 30 -storepass "$PASS" -keypass "$PASS" -dname "CN=FLXXX3 CI" > /dev/null
            echo "KEYSTORE=$RUNNER_TEMP/ci.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_ALIAS=ci" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=ci" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        id: apk
        run: |
          MIXXX_ANDROID_BASE="$BASE" BUILD_DIR="$BASE/build" OUT_APK="$RUNNER_TEMP/out/flxxx3.apk" \
            BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0" GRADLE_OFFLINE=0 \
            bash -c 'mkdir -p "$(dirname "$OUT_APK")" && set -o pipefail && bash docs/android-port/build-install.sh --no-install 2>&1 | tee "$RUNNER_TEMP/build.log"' \
            || { bash tools/ci/annotate_failure.sh Build "$RUNNER_TEMP/build.log"; exit 1; }
          v="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' packaging/android/AndroidManifest.xml)"
          if [ "$SIGNED_WITH" = release ]; then name="FLXXX3-v$v.apk"; else name="FLXXX3-v$v-$SIGNED_WITH-signed.apk"; fi
          mv "$RUNNER_TEMP/out/flxxx3.apk" "$RUNNER_TEMP/out/$name"
          echo "artifact=FLXXX3-v$v-android-$SIGNED_WITH-signed" >> "$GITHUB_OUTPUT"
          ls -l "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error
          retention-days: 30

  start-test:
    name: Start test Android ${{ matrix.version }} (API ${{ matrix.api }})
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 30, version: "11" }
          - { api: 31, version: "12" }
          - { api: 32, version: "12L" }
          - { api: 33, version: "13" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.android.outputs.artifact }}
          path: ${{ runner.temp }}/apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the app in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash tools/ci/android_start_test.sh "$(ls ${{ runner.temp }}/apk/*.apk | head -1)" "${{ runner.temp }}/start-test"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: start-test-api${{ matrix.api }}
          path: ${{ runner.temp }}/start-test
          if-no-files-found: ignore
          retention-days: 14
